name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brightglobe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brightglobe_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Marketplace SQL draft on ephemeral PostgreSQL
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brightglobe_ci
        run: |
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.canonical_users (id uuid PRIMARY KEY);'
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle-drafts/0022_marketplace_source_schema.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle-drafts/0022_marketplace_source_schema.assertions.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle-drafts/0022_marketplace_source_schema.behavior.sql

      - name: Unit and PostgreSQL integration tests
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brightglobe_ci
        run: npm test

      - name: Marketplace Drizzle schema generation (draft only)
        run: |
          npm run db:generate:marketplace-draft
          test -n "$(find drizzle-drafts/generated -type f -name '*.sql' -print -quit)"

      - name: Cloudflare Worker dry run
        run: npm run build

      - name: Globe Play private Worker dry run
        run: npm run build:marketplace

      - name: Globe Play private Worker dry run
        run: npm run build:marketplace
