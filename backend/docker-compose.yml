services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brightglobe
      POSTGRES_USER: brightglobe
      POSTGRES_PASSWORD: brightglobe_dev
    ports:
      - "5432:5432"
    volumes:
      - brightglobe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightglobe -d brightglobe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brightglobe_postgres_data:
