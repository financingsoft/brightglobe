name: Backend CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brightglobe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brightglobe_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate BG reward migrations and Marketplace SQL draft on ephemeral PostgreSQL
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brightglobe_ci
        run: |
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE public.canonical_users (id uuid PRIMARY KEY, status varchar(16) NOT NULL DEFAULT 'active', created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now());"
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE public.asset_registry (id uuid PRIMARY KEY, asset_code varchar(16) NOT NULL, network varchar(24) NOT NULL, token_program varchar(64) NOT NULL, mint_address varchar(44), decimals integer, status varchar(16) NOT NULL DEFAULT 'draft', metadata_source varchar(32) NOT NULL DEFAULT 'unconfigured', created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now());"
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE UNIQUE INDEX asset_registry_code_network_uidx ON public.asset_registry (asset_code, network);"
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE public.wallet_ownerships (id uuid PRIMARY KEY, canonical_user_id uuid NOT NULL REFERENCES public.canonical_users(id) ON DELETE RESTRICT, network varchar(24) NOT NULL, address varchar(44) NOT NULL, verified_at timestamptz NOT NULL, created_at timestamptz NOT NULL DEFAULT now());"
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE UNIQUE INDEX wallet_ownerships_network_address_uidx ON public.wallet_ownerships (network, address);"
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0021_bg_reward_foundation.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0022_bg_reward_engine_atomicity.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public."user" (id text PRIMARY KEY, email text NOT NULL);'
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public."session" (id text PRIMARY KEY, token text NOT NULL, updated_at timestamptz NOT NULL DEFAULT now());'
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.provider_identities (id uuid PRIMARY KEY, canonical_user_id uuid NOT NULL, provider varchar(32) NOT NULL, provider_subject varchar(256) NOT NULL, verified_at timestamptz, created_at timestamptz NOT NULL DEFAULT now());'
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.identity_audit_events (id uuid PRIMARY KEY, canonical_user_id uuid, event_type varchar(64), actor_type varchar(24), actor_id varchar(256), metadata jsonb, created_at timestamptz);'
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.wallet_sessions (id uuid PRIMARY KEY, last_seen_at timestamptz NOT NULL DEFAULT now(), revoked_at timestamptz);'
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.canonical_user_profiles (canonical_user_id uuid PRIMARY KEY, display_name varchar(48), locale varchar(16), bio varchar(160));'
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE brightglobe_play_developer_app NOLOGIN;'
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle-drafts/0022_marketplace_source_schema.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle-drafts/0022_marketplace_source_schema.assertions.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle-drafts/0022_marketplace_source_schema.behavior.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle-drafts/0023_marketplace_private_worker_role_grants.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle-drafts/0023_marketplace_private_worker_role_grants.assertions.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SET ROLE brightglobe_play_developer_app; BEGIN; SELECT id FROM marketplace.developers FOR UPDATE; SELECT developer_id FROM marketplace.developer_memberships FOR UPDATE; SELECT id FROM marketplace.developer_invitations FOR UPDATE; ROLLBACK;'

      - name: Unit and PostgreSQL integration tests
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brightglobe_ci
        run: npm test

      - name: Marketplace Drizzle schema generation (draft only)
        run: |
          npm run db:generate:marketplace-draft
          test -n "$(find drizzle-drafts/generated -type f -name '*.sql' -print -quit)"

      - name: Cloudflare Worker dry run
        run: npm run build

      - name: Globe Play private Worker dry run
        run: npm run build:marketplace
