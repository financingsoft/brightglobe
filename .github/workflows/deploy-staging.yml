name: Deploy BrightGlobe Staging

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-staging.yml"
      - ".github/workflows/validate-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brightglobe-staging-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backend before Staging
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: brightglobe
          POSTGRES_USER: brightglobe
          POSTGRES_PASSWORD: brightglobe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brightglobe -d brightglobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://brightglobe:brightglobe_test@localhost:5432/brightglobe
      BETTER_AUTH_URL: http://localhost:4000
      BETTER_AUTH_SECRET: test-only-secret-that-is-at-least-thirty-two-characters
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: TypeScript strict typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Validate PostgreSQL migrations on disposable database
        working-directory: backend
        run: npm run db:migrate

      - name: Build Cloudflare Worker (dry run)
        working-directory: backend
        run: npm run build

  migrate-and-deploy:
    name: Migrate and deploy isolated Staging environment
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Verify required Staging deployment credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Missing staging Environment secret DATABASE_URL"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Apply migrations to Neon Staging branch only
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Deploy globe-staging Worker
        working-directory: backend
        run: npx wrangler deploy --env staging --keep-vars

      - name: Verify deployed Staging endpoints
        env:
          STAGING_URL: https://globe-staging.wanghui-79b.workers.dev
        run: |
          check_endpoint() {
            local path="$1"
            local label="$2"
            local filter="$3"
            local response
            local body
            local status

            for attempt in $(seq 1 12); do
              response="$(curl --silent --show-error --max-time 10 --write-out $'\\n%{http_code}' "$STAGING_URL$path" 2>&1 || true)"
              status="${response##*$'\\n'}"
              body="${response%$'\\n'*}"

              if [ "$status" = "200" ] && printf '%s' "$body" | jq -e "$filter" >/dev/null 2>&1; then
                echo "$label passed (HTTP 200, attempt $attempt)."
                return 0
              fi

              echo "$label not ready yet (attempt $attempt/12, HTTP $status)."
              sleep 5
            done

            echo "::error::$label failed after 12 attempts; last HTTP status: $status"
            echo "Last response body: $body"
            return 1
          }

          check_endpoint "/" "Root endpoint" '.service == "brightglobe-backend" and .status == "ok"'
          check_endpoint "/health/live" "Liveness endpoint" '.status == "ok"'
          check_endpoint "/health/ready" "Database readiness endpoint" '.status == "ready" and .database == "reachable"'

          echo "Staging root, liveness, and database readiness checks passed."
