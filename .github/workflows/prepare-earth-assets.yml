name: Prepare bundled Earth textures

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/scripts/earth-assets.trigger"

permissions:
  contents: write

concurrency:
  group: brightglobe-earth-assets
  cancel-in-progress: false

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Download, validate, and optimize textures
        run: python app/scripts/download-earth-assets.py

      - name: Commit bundled textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/earth
          if git diff --cached --quiet; then
            echo "Earth assets are already up to date."
            exit 0
          fi
          git commit -m "chore(earth): bundle CC BY 4.0 Earth textures [skip ci]"
          git push origin HEAD:main
