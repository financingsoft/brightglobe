name: Deploy BrightGlobe H5 to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brightglobe-h5-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: TypeScript strict typecheck
        working-directory: app
        run: npm run typecheck

      - name: Expo Doctor
        working-directory: app
        run: npx expo-doctor

      - name: Export static web app
        working-directory: app
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.globeapps.com/staging
          EXPO_PUBLIC_ENABLE_PREVIEW_AUTH: "false"
        run: npm run export:web

      - name: Verify exported site
        run: |
          test -s app/dist/index.html
          test -d app/dist/assets
          echo "Static web export is present."

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy H5 Worker Static Assets
        working-directory: app
        run: npx wrangler deploy --config wrangler.jsonc
