name: Test Cloudflare and Neon credentials

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-cloudflare-neon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cloudflare:
    name: Verify Cloudflare API token and account access
    runs-on: ubuntu-latest
    steps:
      - name: Require Cloudflare secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Verify token status
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            | jq -e '.success == true and .result.status == "active"' >/dev/null
          echo "Cloudflare API token is active."

      - name: Verify account access
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            | jq -e '.success == true and (.result.id | length > 0)' >/dev/null
          echo "Cloudflare account access verified."

  verify-neon:
    name: Verify Neon PostgreSQL connection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Neon connection secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Missing DATABASE_URL"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Connect to Neon and run SELECT 1
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({
            connectionString: process.env.DATABASE_URL,
            connectionTimeoutMillis: 15000,
            application_name: "brightglobe-connection-check"
          });
          try {
            await client.connect();
            const result = await client.query(
              "select 1 as ok, current_database() as database_name, current_user as database_user"
            );
            if (result.rows[0]?.ok !== 1) throw new Error("Unexpected SELECT 1 result");
            console.log("Neon PostgreSQL connection successful.");
            console.log("SELECT 1: passed.");
            console.log("Database:", result.rows[0].database_name);
            console.log("Authenticated database role:", result.rows[0].database_user);
          } catch (error) {
            console.error("Neon connection check failed:", error?.message ?? "unknown error");
            process.exitCode = 1;
          } finally {
            await client.end().catch(() => {});
          }
          NODE
