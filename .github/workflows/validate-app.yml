name: Validate BrightGlobe app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/validate-app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/validate-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-validation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: TypeScript strict typecheck
        working-directory: app
        run: npm run typecheck

      - name: Expo Doctor
        working-directory: app
        run: npx expo-doctor

      - name: Bundle iOS JavaScript and local assets
        working-directory: app
        run: npx expo export --platform ios --output-dir /tmp/brightglobe-ios-export
