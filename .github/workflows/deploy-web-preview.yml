name: Deploy BrightGlobe web preview

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brightglobe-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: TypeScript strict typecheck
        working-directory: app
        run: npm run typecheck

      - name: Expo Doctor
        working-directory: app
        run: npx expo-doctor

      - name: Export static web app
        working-directory: app
        run: npm run export:web

      - name: Verify exported site
        run: |
          test -s app/dist/index.html
          test -d app/dist/assets
          echo "Static web export is present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
