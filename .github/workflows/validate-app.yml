name: Validate BrightGlobe app

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/validate-app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/validate-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-validation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: TypeScript strict typecheck
        working-directory: app
        run: npm run typecheck

      - name: Expo Doctor
        working-directory: app
        run: npx expo-doctor

      - name: Bundle iOS JavaScript and local assets
        working-directory: app
        run: npx expo export --platform ios --output-dir /tmp/brightglobe-ios-export

      - name: Export web bundle
        working-directory: app
        run: npm run export:web -- --output-dir /tmp/brightglobe-web-export

      - name: Install Playwright for visual regression captures
        working-directory: app
        run: npm install --no-save --no-audit --no-fund playwright@1.64.1

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Capture V1.6 reference viewport screenshots
        working-directory: app
        env:
          BRIGHTGLOBE_WEB_EXPORT_DIR: /tmp/brightglobe-web-export
        run: node scripts/capture-ui.mjs

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: brightglobe-v1.6-ui-baseline
          path: app/artifacts/ui-baseline/
          if-no-files-found: error
