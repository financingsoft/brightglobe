name: Deploy BrightGlobe Staging
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Test
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npm run build

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Verify credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Apply Staging database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
      - name: Deploy Staging Worker
        working-directory: backend
        run: npx wrangler deploy --env staging --keep-vars
      - name: Verify Staging endpoints
        env:
          STAGING_URL: https://globe-staging.wanghui-79b.workers.dev
        run: |
          for path in / /health/live /health/ready; do
            ok=0
            for attempt in $(seq 1 12); do
              code=$(curl -sS --max-time 10 -o /tmp/staging-body -w "%{http_code}" "$STAGING_URL$path" || true)
              body=$(cat /tmp/staging-body 2>/dev/null || true)
              if [ "$code" = "200" ]; then
                case "$path" in
                  /) echo "$body" | jq -e '.service == "brightglobe-backend" and .status == "ok"' >/dev/null && ok=1 ;;
                  /health/live) echo "$body" | jq -e '.status == "ok"' >/dev/null && ok=1 ;;
                  /health/ready) echo "$body" | jq -e '.status == "ready" and .database == "reachable"' >/dev/null && ok=1 ;;
                esac
              fi
              [ "$ok" = "1" ] && break
              echo "$path attempt $attempt: HTTP $code"
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "::error::Staging check failed for $path; HTTP $code; body: $body"
              exit 1
            fi
          done
          echo "All Staging endpoint checks passed."
